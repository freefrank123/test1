<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 济小震</title>
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/frontend/assets/js/supabase.min.js"></script>
    <script src="/frontend/assets/js/config.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> 济小震 · 智防未来</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="knowledge.html">地震常识</a></li>
            <li><a href="news.html">地震新闻</a></li>
            <li><a href="emergency.html">应急求助</a></li>
            <li><a href="game.html">地震小游戏</a></li>
        </ul>
        <div class="nav-actions">
            <div class="user-area" id="userArea"></div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-shield-halved auth-logo"></i>
                <h2>济小震</h2>
                <p>科技防灾平台</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>

            <form id="authForm" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> 邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱地址" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> 密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="请输入密码（至少6位）" required minlength="6" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="authError" class="auth-error" style="display:none;"></div>
                <div id="authSuccess" class="auth-success" style="display:none;"></div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <i class="fas fa-sign-in-alt" id="submitIcon"></i><span id="submitText"> 登录</span>
                </button>
            </form>

            <p class="auth-switch">
                <span id="switchPrompt">还没有账号？</span><a href="#" id="switchLink">立即注册</a>
            </p>

            <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>
    </div>

    <script src="/frontend/assets/js/common.js"></script>
    <script>
    // ==================== 登录/注册页面逻辑 ====================
    (function () {
        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const submitIcon = document.getElementById('submitIcon');
        const submitText = document.getElementById('submitText');
        const authError = document.getElementById('authError');
        const authSuccess = document.getElementById('authSuccess');
        const switchPrompt = document.getElementById('switchPrompt');
        const switchLink = document.getElementById('switchLink');
        const togglePassword = document.getElementById('togglePassword');
        const tabBtns = document.querySelectorAll('.auth-tab');

        let mode = 'login';

        function showError(msg) {
            console.error('❌', msg);
            authError.textContent = msg;
            authError.style.display = 'block';
            authSuccess.style.display = 'none';
        }

        function showSuccess(msg) {
            console.log('✅', msg);
            authSuccess.textContent = msg;
            authSuccess.style.display = 'block';
            authError.style.display = 'none';
        }

        function clearMessages() {
            authError.style.display = 'none';
            authSuccess.style.display = 'none';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                submitIcon.className = 'fas fa-spinner fa-pulse';
                submitText.textContent = ' 处理中...';
            } else {
                submitIcon.className = mode === 'login' ? 'fas fa-sign-in-alt' : 'fas fa-user-plus';
                submitText.textContent = mode === 'login' ? ' 登录' : ' 注册';
            }
        }

        function switchMode(newMode) {
            console.log('🔄 切换到:', newMode);
            mode = newMode;
            clearMessages();

            tabBtns.forEach(b => {
                b.classList.toggle('active', b.dataset.tab === mode);
            });

            if (mode === 'login') {
                submitIcon.className = 'fas fa-sign-in-alt';
                submitText.textContent = ' 登录';
                switchPrompt.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                submitIcon.className = 'fas fa-user-plus';
                submitText.textContent = ' 注册';
                switchPrompt.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        // Tab 切换
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                switchMode(this.dataset.tab);
            });
        });

        // 底部链接切换
        switchLink.addEventListener('click', function (e) {
            e.preventDefault();
            switchMode(mode === 'login' ? 'register' : 'login');
        });

        // 密码显示/隐藏
        togglePassword.addEventListener('click', function () {
            const icon = this.querySelector('i');
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isPassword);
            icon.classList.toggle('fa-eye-slash', isPassword);
        });

        // 表单提交
        authForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMessages();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            console.log('📤 提交表单, mode=' + mode + ', email=' + email);

            if (!email || !password) {
                showError('请填写邮箱和密码');
                return;
            }
            if (password.length < 6) {
                showError('密码长度至少为6位');
                return;
            }

            const auth = window.JiXiaoZhen?.Auth;
            console.log('🔍 Auth 状态:', auth ? 'enabled=' + auth.enabled : 'undefined');

            if (!auth || !auth.enabled) {
                showError('认证服务未配置，请在 config.js 中填入 Supabase 凭据');
                return;
            }

            setLoading(true);

            try {
                const action = mode === 'login' ? '登录' : '注册';
                console.log('📡 正在' + action + '...');

                const result = mode === 'login'
                    ? await auth.signIn(email, password)
                    : await auth.signUp(email, password);

                console.log('📡 响应:', result);

                if (result.error) {
                    showError(result.error.message || action + '失败');
                } else if (mode === 'register') {
                    showSuccess('注册成功！请查收邮箱验证邮件（可能在垃圾箱），然后回到此页面登录。');
                    switchMode('login');
                } else {
                    console.log('🏠 登录成功，跳转首页');
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error('💥 异常:', err);
                showError('网络错误：' + (err.message || '未知错误'));
            } finally {
                setLoading(false);
            }
        });

        // 已登录用户自动跳转
        (async function () {
            const auth = window.JiXiaoZhen?.Auth;
            if (auth?.enabled) {
                try {
                    const session = await auth.getSession();
                    if (session) {
                        console.log('🔑 已登录，跳转首页');
                        window.location.href = 'index.html';
                    }
                } catch (e) { /* ignore */ }
            }
        })();
    })();
    </script>
</body>
</html>
