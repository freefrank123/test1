<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> 济小震 · 智防未来</div>
        <ul class="nav-links">

            <li><a href="news.html">地震新闻</a></li>

        <div class="nav-actions">

            <button class="theme-toggle" id="themeToggle">

    <div class="container">
        <header class="hero-card" style="padding: 2rem 2rem; margin-bottom: 2rem;">
            <h1 style="font-size: 2.2rem;"><i class="fas fa-chart-line"></i> 专家文章</h1>
            <p>地震学专家撰写的深度分析文章与最新研究成果</p>
        </header>

        <div class="card">
            <h2><i class="fas fa-newspaper"></i> 专家专栏</h2>
            <div id="expertArticles">
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
            </div>
            <div id="expertEmpty" style="display:none;text-align:center;padding:2rem;color:var(--text-muted);">
                <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:.5rem;"></i>
                暂无专家文章
            </div>
        </div>

        <div style="margin-top:1rem;">
            <a href="knowledge.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> 返回知识中枢</a>
        </div>

    <script src="/frontend/assets/js/auth.js"></script>
    <script src="/frontend/assets/js/common.js"></script>
    <script src="/frontend/assets/js/api.js"></script>
    <script src="/frontend/assets/js/user.js"></script>
    <script src="/frontend/assets/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async function () {
        // TODO: 替换为实际 API 端点
        // const data = await fetch('/api/knowledge/expert').then(r => r.json());
        // if (data && data.length > 0) renderArticles(data);
    });

    function renderArticles(list) {
        const container = document.getElementById('expertArticles');
        container.innerHTML = list.map(item => `
            <div class="knowledge-item" style="padding:1rem 1.2rem; border-left:4px solid var(--accent-primary);
                        background:var(--bg-tertiary); border-radius:var(--card-radius-sm); margin-bottom:.8rem;
                        cursor:pointer; transition:all .2s ease;">
                <h4 style="margin:0 0 .3rem;color:var(--accent-primary);">${item.author ? item.author + '：' : ''}${item.title || ''}</h4>
                <p style="margin:0;color:var(--text-secondary);font-size:.88rem;">${item.summary || ''}</p>
            </div>
        `).join('');
    }
    </script>
</body>
</html>
