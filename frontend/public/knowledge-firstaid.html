<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急救知识科普 - 济小震</title>
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> 济小震 · 智防未来</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="knowledge.html">地震常识</a></li>
            <li><a href="news.html">地震新闻</a></li>
            <li><a href="emergency.html">应急求助</a></li>
            <li><a href="game.html">地震小游戏</a></li>
        </ul>
        <div class="nav-actions">
            <div class="user-area" id="userArea"></div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <header class="hero-card" style="padding: 2rem 2rem; margin-bottom: 2rem;">
            <h1 style="font-size: 2.2rem;"><i class="fas fa-hand-holding-heart"></i> 急救知识科普</h1>
            <p>震后自救互救、伤员转运、心理疏导等实用急救技能</p>
        </header>

        <div class="card">
            <h2><i class="fas fa-list-alt"></i> 急救指南</h2>
            <div id="firstaidArticles">
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
                <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px;"></div>
            </div>
            <div id="firstaidEmpty" style="display:none;text-align:center;padding:2rem;color:var(--text-muted);">
                <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:.5rem;"></i>
                暂无急救文章
            </div>
        </div>

        <div style="margin-top:1rem;">
            <a href="knowledge.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> 返回知识中枢</a>
        </div>
    </div>

    <footer>&copy; 2025 济小震 · 科技防灾平台 | 知识守护生命</footer>

    <script src="/frontend/assets/js/supabase.min.js"></script>
    <script src="/frontend/assets/js/config.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script src="/frontend/assets/js/common.js"></script>
    <script src="/frontend/assets/js/api.js"></script>
    <script src="/frontend/assets/js/user.js"></script>
    <script src="/frontend/assets/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async function () {
        const container = document.getElementById('firstaidArticles');
        const emptyDiv = document.getElementById('firstaidEmpty');
        
        try {
            const resp = await fetch('http://localhost:5000/api/knowledge/category/firstaid');
            const data = await resp.json();
            
            if (data.success && data.data.length > 0) {
                renderArticles(data.data);
                emptyDiv.style.display = 'none';
            } else {
                container.innerHTML = '';
                emptyDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('加载失败:', err);
            container.innerHTML = '<p style="color:#ef4444;padding:1rem;">加载失败，请稍后重试</p>';
        }
    });

    function renderArticles(list) {
        const container = document.getElementById('firstaidArticles');
        container.innerHTML = list.map(item => `
            <div class="knowledge-item" style="padding:1rem 1.2rem; border-left:4px solid var(--accent-primary);
                        background:var(--bg-tertiary); border-radius:var(--card-radius-sm); margin-bottom:.8rem;
                        cursor:pointer; transition:all .2s ease;" onclick="showDetail(${item.id})">
                <h4 style="margin:0 0 .3rem;color:var(--accent-primary);">${escapeHtml(item.title || '')}</h4>
                <p style="margin:0;color:var(--text-secondary);font-size:.88rem;">${escapeHtml(item.summary || '')}</p>
                <div style="margin-top:.5rem;font-size:.78rem;color:var(--text-muted);">
                    <span><i class="fas fa-user"></i> ${escapeHtml(item.author || '')}</span>
                    <span style="margin-left:1rem;"><i class="fas fa-eye"></i> ${item.view_count || 0}</span>
                </div>
            </div>
        `).join('');
    }

    function showDetail(id) {
        window.location.href = `knowledge.html?id=${id}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    </script>
</body>
</html>
