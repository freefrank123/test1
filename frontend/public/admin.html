<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识管理 - 济小震后台</title>
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }
        th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: .9rem;
        }
        tr:hover {
            background: var(--bg-tertiary);
        }
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: .78rem;
            font-weight: 600;
        }
        .category-def { background: #dbeafe; color: #1e40af; }
        .category-mag { background: #fef3c7; color: #b45309; }
        .category-firstaid { background: #dcfce7; color: #166534; }
        .category-building { background: #fce7f3; color: #9d174d; }
        .btn-group {
            display: flex;
            gap: .4rem;
        }
        .btn-sm {
            padding: .4rem .8rem;
            font-size: .8rem;
            border-radius: 6px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .modal-header h3 {
            margin: 0;
            color: var(--text-primary);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: .3rem;
            border-radius: 6px;
            transition: all .2s ease;
        }
        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .modal-body {
            padding: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: .4rem;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: .9rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: .9rem;
            outline: none;
            transition: all .25s ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: .8rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-subtle);
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: .5;
        }
        .search-bar {
            display: flex;
            gap: .8rem;
            margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1;
            padding: .7rem 1rem;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: .9rem;
            outline: none;
            transition: all .25s ease;
        }
        .search-bar input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .filter-select {
            padding: .7rem 1rem;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: .9rem;
            outline: none;
            cursor: pointer;
            min-width: 140px;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            z-index: 2000;
            animation: slideInRight .3s ease;
        }
        .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> 济小震 · 后台管理</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="knowledge.html">知识中心</a></li>
            <li><a href="admin.html" class="active">管理后台</a></li>
        </ul>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-book-open"></i> 知识管理</h1>
            <button class="btn-primary" onclick="openAddModal()">
                <i class="fas fa-plus"></i> 添加文章
            </button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索文章标题...">
            <select class="filter-select" id="categoryFilter">
                <option value="">全部分类</option>
                <option value="def">地震科普</option>
                <option value="mag">专家文章</option>
                <option value="firstaid">急救知识</option>
                <option value="building">建筑抗震</option>
            </select>
            <button class="btn-secondary" onclick="loadKnowledge()">
                <i class="fas fa-refresh"></i> 刷新
            </button>
        </div>

        <div class="table-container">
            <table id="knowledgeTable">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>分类</th>
                        <th>作者</th>
                        <th>浏览量</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <div>加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 添加/编辑弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">添加知识文章</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="knowledgeForm">
                    <input type="hidden" id="formId">
                    <div class="form-group">
                        <label for="formTitle">标题 *</label>
                        <input type="text" id="formTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="formCategory">分类 *</label>
                        <select id="formCategory" required>
                            <option value="">请选择分类</option>
                            <option value="def">地震科普知识</option>
                            <option value="mag">专家文章</option>
                            <option value="firstaid">急救知识科普</option>
                            <option value="building">建筑抗震</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="formAuthor">作者</label>
                        <input type="text" id="formAuthor">
                    </div>
                    <div class="form-group">
                        <label for="formSource">来源</label>
                        <input type="text" id="formSource">
                    </div>
                    <div class="form-group">
                        <label for="formKeywords">关键词（逗号分隔）</label>
                        <input type="text" id="formKeywords">
                    </div>
                    <div class="form-group">
                        <label for="formSummary">摘要</label>
                        <textarea id="formSummary"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="formContent">内容 *</label>
                        <textarea id="formContent" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="saveKnowledge()">保存</button>
            </div>
        </div>
    </div>

    <script src="/frontend/assets/js/supabase.min.js"></script>
    <script src="/frontend/assets/js/config.js"></script>
    <script src="/frontend/assets/js/common.js"></script>
    <script>
        const API_BASE = '/api';

        async function loadKnowledge() {
            const keyword = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            
            let url = `${API_BASE}/knowledge`;
            if (keyword) {
                url = `${API_BASE}/knowledge/search?keyword=${encodeURIComponent(keyword)}`;
            } else if (category) {
                url = `${API_BASE}/knowledge/category/${category}`;
            }

            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    renderTable(result.data);
                } else {
                    showToast('加载失败: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
                console.error(error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <div>暂无数据</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <span title="${item.title}">${item.title}</span>
                    </td>
                    <td>
                        <span class="category-badge category-${item.category}">${getCategoryName(item.category)}</span>
                    </td>
                    <td>${item.author || '-'}</td>
                    <td>${item.view_count || 0}</td>
                    <td>${formatDate(item.created_at)}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-secondary btn-sm" onclick="openEditModal(${item.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-danger btn-sm" onclick="deleteKnowledge(${item.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getCategoryName(category) {
            const names = {
                'def': '地震科普',
                'mag': '专家文章',
                'firstaid': '急救知识',
                'building': '建筑抗震'
            };
            return names[category] || category;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加知识文章';
            document.getElementById('knowledgeForm').reset();
            document.getElementById('formId').value = '';
            document.getElementById('modalOverlay').classList.add('show');
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE}/knowledge/${id}`);
                const result = await response.json();
                
                if (result.success) {
                    const item = result.data;
                    document.getElementById('modalTitle').textContent = '编辑知识文章';
                    document.getElementById('formId').value = item.id;
                    document.getElementById('formTitle').value = item.title;
                    document.getElementById('formCategory').value = item.category;
                    document.getElementById('formAuthor').value = item.author || '';
                    document.getElementById('formSource').value = item.source || '';
                    document.getElementById('formKeywords').value = item.keywords || '';
                    document.getElementById('formSummary').value = item.summary || '';
                    document.getElementById('formContent').value = item.content;
                    document.getElementById('modalOverlay').classList.add('show');
                } else {
                    showToast('获取数据失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        async function saveKnowledge() {
            const id = document.getElementById('formId').value;
            const data = {
                title: document.getElementById('formTitle').value,
                category: document.getElementById('formCategory').value,
                author: document.getElementById('formAuthor').value,
                source: document.getElementById('formSource').value,
                keywords: document.getElementById('formKeywords').value,
                summary: document.getElementById('formSummary').value,
                content: document.getElementById('formContent').value
            };

            try {
                const url = id ? `${API_BASE}/knowledge/${id}` : `${API_BASE}/knowledge`;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showToast(id ? '更新成功' : '添加成功', 'success');
                    closeModal();
                    loadKnowledge();
                } else {
                    showToast('保存失败: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        async function deleteKnowledge(id) {
            if (!confirm('确定要删除这篇文章吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/knowledge/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    showToast('删除成功', 'success');
                    loadKnowledge();
                } else {
                    showToast('删除失败: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight .3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loadKnowledge();
        });

        document.getElementById('categoryFilter').addEventListener('change', loadKnowledge);

        document.addEventListener('DOMContentLoaded', () => {
            loadKnowledge();
            initThemeToggle();
        });
    </script>
</body>
</html>
