<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震新闻 - 济小震</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> 济小震 · 智防未来</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="knowledge.html">地震常识</a></li>
            <li><a href="news.html">地震新闻</a></li>
            <li><a href="emergency.html">应急求助</a></li>
            <li><a href="game.html">地震小游戏</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <div class="container">
        <header class="hero-card" style="padding: 2rem 2rem; margin-bottom: 2rem;">
            <h1 style="font-size: 2.2rem;"><i class="fas fa-earth-americas"></i> 全球地震速报</h1>
            <p>数据来源：中国地震台网 | 实时更新 | 权威发布</p>
        </header>

        <!-- 中国地震台网官方地震速报嵌入 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2><i class="fas fa-bolt"></i> 实时地震速报</h2>
                <a href="https://www.cenc.ac.cn/earthquake-manage-publish-web/search" target="_blank" class="btn-secondary" style="font-size: 0.85rem; padding: 0.3rem 0.8rem;">
                    <i class="fas fa-external-link-alt"></i> 查看官方页面
                </a>
            </div>
            <div id="earthquakeFeed" style="margin-top: 1rem;">
                <!-- 加载动画 -->
                <div class="loading-container" style="text-align: center; padding: 2rem;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #3498db;"></i>
                    <p style="margin-top: 1rem;">正在获取最新地震数据...</p>
                </div>
            </div>
        </div>

        <!-- 历史地震搜索卡片 -->
        <div class="card">
            <h2><i class="fas fa-history"></i> 历史地震搜索</h2>
            <div class="search-section">
                <!-- 震级筛选 -->
                <div class="filter-group">
                    <label><i class="fas fa-ruler-combined"></i> 震级大小</label>
                    <div class="mag-options">
                        <label class="radio-label"><input type="radio" name="magType" value="3plus" checked> 3 级以上</label>
                        <label class="radio-label"><input type="radio" name="magType" value="5plus"> 5 级以上</label>
                        <label class="radio-label"><input type="radio" name="magType" value="7plus"> 7 级以上</label>
                        <label class="radio-label"><input type="radio" name="magType" value="custom"> 自定义范围</label>
                        <div class="custom-mag" id="customMagRange">
                            <input type="number" id="minMag" placeholder="最小震级" step="0.1" min="0" max="10">
                            <span>—</span>
                            <input type="number" id="maxMag" placeholder="最大震级" step="0.1" min="0" max="10">
                        </div>
                    </div>
                </div>

                <!-- 日期筛选 -->
                <div class="filter-group">
                    <label><i class="fas fa-calendar-alt"></i> 日期范围</label>
                    <div class="date-options">
                        <label class="radio-label"><input type="radio" name="dateType" value="week" checked> 近一周</label>
                        <label class="radio-label"><input type="radio" name="dateType" value="month"> 近一个月</label>
                        <label class="radio-label"><input type="radio" name="dateType" value="year"> 近一年</label>
                        <label class="radio-label"><input type="radio" name="dateType" value="custom"> 自定义</label>
                        <div class="custom-date" id="customDateRange">
                            <input type="date" id="startDate"> <span>—</span> <input type="date" id="endDate">
                        </div>
                    </div>
                </div>

                <!-- 地理位置筛选 -->
                <div class="filter-group">
                    <label><i class="fas fa-globe"></i> 地理位置</label>
                    <div class="location-options">
                        <label class="radio-label"><input type="radio" name="locType" value="china" checked> 中国范围</label>
                        <label class="radio-label"><input type="radio" name="locType" value="world"> 世界范围</label>
                        <label class="radio-label"><input type="radio" name="locType" value="custom"> 自定义国家</label>
                        <div class="custom-location" id="customCountry">
                            <select id="countrySelect">
                                <option value="">请选择国家</option>
                                <option value="中国">中国</option>
                                <option value="日本">日本</option>
                                <option value="印尼">印尼</option>
                                <option value="美国">美国</option>
                                <option value="土耳其">土耳其</option>
                                <option value="意大利">意大利</option>
                                <option value="墨西哥">墨西哥</option>
                                <option value="新西兰">新西兰</option>
                                <option value="伊朗">伊朗</option>
                                <option value="智利">智利</option>
                                <option value="秘鲁">秘鲁</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchHistoryBtn" class="btn-primary"><i class="fas fa-search"></i> 搜索历史地震</button>
                    <button id="resetFiltersBtn" class="btn-secondary"><i class="fas fa-undo"></i> 重置筛选</button>
                    <a href="https://www.cenc.ac.cn/earthquake-manage-publish-web/search" target="_blank" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;">
                        <i class="fas fa-external-link-alt"></i> 官方查询
                    </a>
                </div>
            </div>
        </div>

        <!-- 中国地震台网嵌入查询 -->
        <div class="card">
            <h2><i class="fas fa-database"></i> 历史地震数据查询</h2>
            <div id="earthquakeTable">
                <div style="border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
                    <iframe 
                        id="cencIframe" 
                        src="https://www.cenc.ac.cn/earthquake-manage-publish-web/search" 
                        width="100%" 
                        height="600px" 
                        frameborder="0"
                        style="background: #fff;">
                    </iframe>
                </div>
                <p style="text-align: center; margin-top: 1rem; color: #95a5a6; font-size: 0.85rem;">
                    数据来源：中国地震台网 | 点击搜索按钮可跳转到官方查询页面
                </p>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 济小震 · 科技防灾平台 | 数据来源：中国地震台网 (CEIC)</footer>

    <script>
        // 控制自定义选项的显示与隐藏
        const customMagDiv = document.getElementById('customMagRange');
        const customDateDiv = document.getElementById('customDateRange');
        const customCountryDiv = document.getElementById('customCountry');

        function togglePanel(radioName, panel) {
            const selected = document.querySelector(`input[name="${radioName}"]:checked`);
            if (panel) panel.style.display = (selected && selected.value === 'custom') ? 'flex' : 'none';
        }

        document.querySelectorAll('input[name="magType"]').forEach(r =>
            r.addEventListener('change', () => togglePanel('magType', customMagDiv)));
        document.querySelectorAll('input[name="dateType"]').forEach(r =>
            r.addEventListener('change', () => togglePanel('dateType', customDateDiv)));
        document.querySelectorAll('input[name="locType"]').forEach(r =>
            r.addEventListener('change', () => togglePanel('locType', customCountryDiv)));

        togglePanel('magType', customMagDiv);
        togglePanel('dateType', customDateDiv);
        togglePanel('locType', customCountryDiv);

        // Mock地震数据（备用）
        const mockEarthquakeData = [
            {"time":"2026-05-12 14:30:22","location":"新疆阿克苏地区温宿县","magnitude":"4.5","depth":"10km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-12 08:15:33","location":"四川甘孜州泸定县","magnitude":"3.2","depth":"15km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-11 22:45:18","location":"云南普洱市景谷县","magnitude":"3.8","depth":"8km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-11 16:20:45","location":"西藏那曲市比如县","magnitude":"4.2","depth":"20km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-10 10:05:12","location":"青海玉树州杂多县","magnitude":"3.5","depth":"12km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-10 02:30:08","location":"甘肃酒泉市阿克塞县","magnitude":"3.0","depth":"18km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-09 19:45:33","location":"台湾花莲县","magnitude":"4.8","depth":"25km","content":"据中国地震台网正式测定"},
            {"time":"2026-05-09 11:20:15","location":"内蒙古阿拉善盟阿拉善左旗","magnitude":"3.3","depth":"10km","content":"据中国地震台网正式测定"}
        ];

        // 获取地震数据并展示
        async function loadEarthquakeData() {
            const container = document.getElementById('earthquakeFeed');
            
            try {
                // 尝试从中国地震台网获取数据（使用公开API）
                const response = await fetch('https://api.ceic.ac.cn/earthquake', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayEarthquakeData(data);
                    return;
                }
            } catch (error) {
                console.error('获取实时数据失败，使用备用数据:', error);
            }
            
            // 使用Mock数据
            displayEarthquakeData({ data: mockEarthquakeData });
        }

        // 展示地震数据
        function displayEarthquakeData(data) {
            const container = document.getElementById('earthquakeFeed');
            
            if (!data || (!data.data && !data.result && !data.list)) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <i class="fas fa-info-circle" style="font-size: 2rem; color: #95a5a6;"></i>
                        <p style="margin-top: 1rem;">暂时无法获取实时数据</p>
                        <p style="color: #95a5a6; font-size: 0.9rem;">以下为历史数据展示</p>
                    </div>
                `;
                displayEarthquakeData({ data: mockEarthquakeData });
                return;
            }
            
            let list = [];
            if (data.data && Array.isArray(data.data)) list = data.data;
            else if (data.result && Array.isArray(data.result)) list = data.result;
            else if (data.list && Array.isArray(data.list)) list = data.list;
            
            if (list.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <i class="fas fa-check-circle" style="font-size: 2rem; color: #27ae60;"></i>
                        <p style="margin-top: 1rem;">近期暂无地震记录</p>
                    </div>
                `;
                return;
            }
            
            // 生成地震列表
            container.innerHTML = list.slice(0, 8).map((item, index) => {
                const time = item.O_TIME || item.time || item.OTime || '';
                const location = item.EPI_CIRCLE || item.location || item.place || item.Epicenter || '';
                const magnitude = item.M || item.magnitude || item.Magnitude || '';
                const depth = item.EPI_DEPTH ? `${item.EPI_DEPTH}km` : (item.depth ? `${item.depth}km` : '未知');
                
                // 根据震级设置颜色
                let magColor = '#27ae60';
                if (parseFloat(magnitude) >= 5) magColor = '#e67e22';
                if (parseFloat(magnitude) >= 7) magColor = '#e74c3c';
                
                return `
                    <div class="earthquake-item" style="display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid #eee; transition: background 0.2s;">
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <span style="font-weight: 600; color: ${magColor}; font-size: 1.1rem;">${magnitude}级</span>
                                <span style="color: #2c3e50; font-size: 0.95rem;">${location}</span>
                            </div>
                            <div style="color: #95a5a6; font-size: 0.85rem; margin-top: 0.25rem;">
                                ${time} | 震源深度 ${depth}
                            </div>
                        </div>
                        <div style="margin-left: 1rem;">
                            <span class="earthquake-indicator" style="width: 8px; height: 8px; background: ${magColor}; border-radius: 50%; display: block;"></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 加载历史地震表格数据
        function loadHistoryTable(data = mockEarthquakeData) {
            const tbody = document.querySelector('#earthquakeDataTable tbody');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.time}</td>
                    <td>${item.location}</td>
                    <td>${item.magnitude}</td>
                    <td>${item.depth}</td>
                </tr>
            `).join('');
        }

        // 搜索按钮事件 - 更新iframe显示中国地震台网查询结果
        document.getElementById('searchHistoryBtn').addEventListener('click', function () {
            const iframe = document.getElementById('cencIframe');
            
            // 震级筛选
            const magType = document.querySelector('input[name="magType"]:checked').value;
            let minMag = '', maxMag = '';
            if (magType === '3plus') { minMag = '3'; maxMag = '10'; }
            else if (magType === '5plus') { minMag = '5'; maxMag = '10'; }
            else if (magType === '7plus') { minMag = '7'; maxMag = '10'; }
            else if (magType === 'custom') {
                minMag = document.getElementById('minMag').value || '';
                maxMag = document.getElementById('maxMag').value || '';
            }

            // 日期筛选
            const dateType = document.querySelector('input[name="dateType"]:checked').value;
            let startDate = '', endDate = '';
            const now = new Date();
            if (dateType === 'week') {
                const d = new Date(now); d.setDate(d.getDate() - 7);
                startDate = d.toISOString().split('T')[0];
                endDate = now.toISOString().split('T')[0];
            } else if (dateType === 'month') {
                const d = new Date(now); d.setMonth(d.getMonth() - 1);
                startDate = d.toISOString().split('T')[0];
                endDate = now.toISOString().split('T')[0];
            } else if (dateType === 'year') {
                const d = new Date(now); d.setFullYear(d.getFullYear() - 1);
                startDate = d.toISOString().split('T')[0];
                endDate = now.toISOString().split('T')[0];
            } else if (dateType === 'custom') {
                startDate = document.getElementById('startDate').value || '';
                endDate = document.getElementById('endDate').value || '';
            }

            // 构建查询URL
            let queryUrl = 'https://www.cenc.ac.cn/earthquake-manage-publish-web/search';
            const params = [];
            if (minMag) params.push(`minMagnitude=${minMag}`);
            if (maxMag) params.push(`maxMagnitude=${maxMag}`);
            if (startDate) params.push(`startTime=${startDate}`);
            if (endDate) params.push(`endTime=${endDate}`);
            
            const locType = document.querySelector('input[name="locType"]:checked').value;
            if (locType === 'china') params.push('region=china');
            else if (locType === 'world') params.push('region=world');
            else if (locType === 'custom') {
                const country = document.getElementById('countrySelect').value;
                if (country) params.push(`country=${encodeURIComponent(country)}`);
            }

            if (params.length > 0) {
                queryUrl += '?' + params.join('&');
            }

            // 更新iframe显示官方查询页面
            iframe.src = queryUrl;
            iframe.style.opacity = '0.5';
            
            // 加载完成后恢复透明度
            iframe.onload = function() {
                iframe.style.opacity = '1';
            };
        });

        // 重置筛选按钮
        document.getElementById('resetFiltersBtn').addEventListener('click', function () {
            document.querySelector('input[name="magType"][value="3plus"]').checked = true;
            document.querySelector('input[name="dateType"][value="week"]').checked = true;
            document.querySelector('input[name="locType"][value="china"]').checked = true;
            togglePanel('magType', customMagDiv);
            togglePanel('dateType', customDateDiv);
            togglePanel('locType', customCountryDiv);
            document.getElementById('minMag').value = '';
            document.getElementById('maxMag').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('countrySelect').value = '';
            
            // 重置iframe到默认页面
            const iframe = document.getElementById('cencIframe');
            iframe.src = 'https://www.cenc.ac.cn/earthquake-manage-publish-web/search';
        });

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadEarthquakeData();
        });
    </script>

    <style>
        .data-table {
            width:100%;
            border-collapse:collapse;
            margin-top:1rem;
        }
        .data-table th,
        .data-table td {
            padding:.75rem;
            text-align:left;
            border-bottom:1px solid #eee;
        }
        .data-table th {
            background:#f8f9fa;
            font-weight:600;
        }
        .data-table tr:hover {
            background:#f8f9fa;
        }
        .earthquake-item:hover {
            background: #f8f9fa !important;
        }
        .earthquake-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

    <script src="../js/common.js"></script>
</body>
</html>
